name: AWS Full Deploy (Manual)

# Manual trigger only — use this for first-time infrastructure setup.
# Day-to-day deployments use aws-deploy.yml (triggered on push to main).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
      AWS_ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
      AWS_ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
      AWS_ECS_SUBNETS: ${{ secrets.AWS_ECS_SUBNETS }}
      AWS_ECS_SECURITY_GROUPS: ${{ secrets.AWS_ECS_SECURITY_GROUPS }}
      AWS_TASK_EXECUTION_ROLE_NAME: ${{ secrets.AWS_TASK_EXECUTION_ROLE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$AWS_ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$AWS_ECR_REPOSITORY"
          else
            echo "ECR repo $AWS_ECR_REPOSITORY already exists"
          fi

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.AWS_ECR_REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          IMAGE_URI=${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPOSITORY }}:$IMAGE_TAG
          docker build -f Docker/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Ensure task execution role exists
        id: ensure-role
        run: |
          ROLE_NAME=${AWS_TASK_EXECUTION_ROLE_NAME:-ecsTaskExecutionRole}
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            TRUST='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "$TRUST"
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
          else
            echo "Role $ROLE_NAME exists"
          fi
          ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query 'Role.Arn' --output text)
          echo "ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"

      - name: Ensure CloudWatch log group exists
        run: |
          LOG_GROUP="/ecs/$AWS_ECS_SERVICE"
          aws logs create-log-group --log-group-name "$LOG_GROUP" 2>/dev/null || true

      - name: Ensure ECS cluster exists
        run: |
          STATUS=$(aws ecs describe-clusters --clusters "$AWS_ECS_CLUSTER" --query 'clusters[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" != "ACTIVE" ]; then
            aws ecs create-cluster --cluster-name "$AWS_ECS_CLUSTER"
          else
            echo "Cluster $AWS_ECS_CLUSTER exists"
          fi

      - name: Register ECS task definition
        run: |
          jq --arg img "$IMAGE_URI" --arg role "$ROLE_ARN" \
            '.containerDefinitions[0].image = $img | .executionRoleArn = $role | .taskRoleArn = $role' \
            aws/ecs-task-def.json > aws/ecs-task-def-generated.json
          aws ecs register-task-definition --cli-input-json file://aws/ecs-task-def-generated.json

      - name: Create or update ECS service
        run: |
          STATUS=$(aws ecs describe-services --cluster "$AWS_ECS_CLUSTER" --services "$AWS_ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if echo "$STATUS" | grep -qE 'ACTIVE|DRAINING|PROVISIONING'; then
            echo "Service exists — forcing new deployment"
            aws ecs update-service --cluster "$AWS_ECS_CLUSTER" --service "$AWS_ECS_SERVICE" --force-new-deployment
          else
            echo "Creating service $AWS_ECS_SERVICE"
            TASK_FAMILY=$(jq -r '.family' aws/ecs-task-def-generated.json)
            aws ecs create-service \
              --cluster "$AWS_ECS_CLUSTER" \
              --service-name "$AWS_ECS_SERVICE" \
              --task-definition "$TASK_FAMILY" \
              --launch-type FARGATE \
              --desired-count 1 \
              --network-configuration "awsvpcConfiguration={subnets=[$AWS_ECS_SUBNETS],securityGroups=[$AWS_ECS_SECURITY_GROUPS],assignPublicIp=ENABLED}"
          fi
