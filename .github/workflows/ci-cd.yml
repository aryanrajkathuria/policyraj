name: CI Check

# Runs on pull requests only — validates the build before merge.
# Actual deployment on push to main is handled by aws-deploy.yml.
on:
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build Docker image
        run: docker build -f Docker/Dockerfile -t policyraj-backend .
